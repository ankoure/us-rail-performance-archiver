services:
  api:
    image: ghcr.io/ankoure/us-rail-performance-archiver-dashboard-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"

  # Reverse proxy + automatic HTTPS (Let's Encrypt via ACME HTTP-01, hence
  # ports 80/443 open on the box's security group). Caddy renews certs on
  # its own — no cron/manual step needed.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
