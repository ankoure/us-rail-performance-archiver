name: datadog-sync

# Pushes datadog/monitors/ and datadog/dashboards/ JSON to Datadog via its management API.
# Unlike deploy.yml this needs no AWS/OIDC — it talks straight to Datadog.

on:
  push:
    branches: [main]
    paths:
      - "datadog/monitors/**"
      - "datadog/dashboards/**"
      - "scripts/sync_datadog.py"
      - ".github/workflows/datadog.yml"
  pull_request:
    paths:
      - "datadog/monitors/**"
      - "datadog/dashboards/**"
      - "scripts/sync_datadog.py"
      - ".github/workflows/datadog.yml"
  workflow_dispatch:

concurrency:
  # PR validation runs don't write, so they don't need to queue behind a sync.
  group: datadog-sync-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate monitors (PR, no writes)
        if: github.event_name == 'pull_request'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
        run: python scripts/sync_datadog.py --dry-run --monitors-only

      - name: Sync monitors and dashboards
        if: github.event_name != 'pull_request'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
        run: python scripts/sync_datadog.py
