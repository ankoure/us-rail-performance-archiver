name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must satisfy pyproject's `requires-python = ">=3.13"`. It was pinned
        # to 3.12, which put 3.12 first on PATH for maturin (-> a cp312 wheel)
        # while `uv sync` still built a 3.13 .venv from requires-python. The
        # install step then couldn't resolve the wheel and the whole backend job
        # died before pytest ever ran -- red since 2026-09-03 (a2e0d42).
        python-version: ["3.13"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev --group dashboard-api
      # rail_decoder is a maturin-built extension, not a declared dependency, so
      # `uv sync` never brings it in. Without the four steps below, the tests that
      # import it (test_decoder.py, the rust branch of test_rollup.py) fail with
      # ModuleNotFoundError. Must come AFTER the sync above: an explicit
      # `uv sync` prunes anything absent from the lock file, the wheel included.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rail-decoder
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build rail_decoder into the project venv
        run: make rust-dev
      # --no-sync so pytest can't re-sync the wheel back out from under itself.
      - name: test code with pytest
        run: uv run --no-sync pytest

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rail-decoder
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python (pyo3 build needs headers on PATH)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rail-decoder
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: test code with cargo test
        run: cargo test
