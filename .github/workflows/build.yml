name: build

on:
  push:
    branches: [main]
    # Keeps `:latest` fresh for the Fargate rollup task (which pulls `:latest`
    # fresh on every scheduled run, so it needs no restart) without touching
    # the EC2 poller box. Paths that DO need a poller restart are handled by
    # deploy.yml's own trigger instead (which calls this workflow itself via
    # workflow_call) — ignored here so a poller-relevant push doesn't build
    # twice. Keep this list paired with the `paths:` list in deploy.yml.
    paths-ignore:
      - "dashboard/**"
      - "docs/**"
      - "notebooks/**"
      - "site/**"
      - "terraform/**"
      - ".claude/**"
      - ".github/**"
      - "**/*.md"
      - "LICENSE"
      - "main.py"
      - "archiver/**"
      - "rail-decoder/**"
      - "config/feeds.yaml"
      - "compose.prod.yml"
      - "dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
  workflow_call:
    outputs:
      tag:
        description: "Short SHA used as the image tag"
        value: ${{ jobs.build.outputs.tag }}
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation so the same manifest serves the amd64
      # Fargate rollup task and the arm64 (t4g) poller box.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
